apiVersion: apps/v1
kind: Deployment
metadata:
  name: "ons-sandbox"
spec:
  selector:
    matchLabels:
      app: "ons-sandbox"
  template:
    metadata:
      labels:
        app: "ons-sandbox"
    spec:
      containers:
        - name: "ons-sandbox"
          image: "ons-sandbox:latest"
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 80
            initialDelaySeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 80
            initialDelaySeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          env:
            - name: MICRONAUT_ENVIRONMENTS
              value: cv-k8s
---
apiVersion: v1
kind: Service
metadata:
  name: "ons-sandbox"
spec:
  selector:
    app: "ons-sandbox"
  type: LoadBalancer
  ports:
    - protocol: "TCP"
      port: 80
